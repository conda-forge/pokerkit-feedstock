schema_version: 1

context:
  name: pokerkit
  version: "0.7.8"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/pokerkit-${{ version }}.tar.gz
  sha256: 1efa02cdf67d2c7c0d89bf7931ef8a8884e3cd4c5ec90d9c5657a47fd72f3659

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - pokerkit
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: A Python package for various poker tools
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/uoftcprg/pokerkit

extra:
  recipe-maintainers:
    - thewchan
